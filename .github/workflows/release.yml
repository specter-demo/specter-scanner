name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    name: Build and release
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Run tests
        run: make test

      - name: Build binaries
        run: |
          mkdir -p dist

          GOOS=linux   GOARCH=amd64  go build -ldflags="-s -w -X main.Version=${{ github.ref_name }}" -o dist/specter-scanner-linux-amd64   ./cmd/scanner
          GOOS=linux   GOARCH=arm64  go build -ldflags="-s -w -X main.Version=${{ github.ref_name }}" -o dist/specter-scanner-linux-arm64   ./cmd/scanner
          GOOS=darwin  GOARCH=amd64  go build -ldflags="-s -w -X main.Version=${{ github.ref_name }}" -o dist/specter-scanner-darwin-amd64  ./cmd/scanner
          GOOS=darwin  GOARCH=arm64  go build -ldflags="-s -w -X main.Version=${{ github.ref_name }}" -o dist/specter-scanner-darwin-arm64  ./cmd/scanner
          GOOS=windows GOARCH=amd64  go build -ldflags="-s -w -X main.Version=${{ github.ref_name }}" -o dist/specter-scanner-windows-amd64.exe ./cmd/scanner

      - name: Create checksums
        run: |
          cd dist
          sha256sum specter-scanner-* > checksums.txt

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: "Specter Scanner ${{ github.ref_name }}"
          body: |
            ## Specter Scanner ${{ github.ref_name }}

            Open-source AI agent security scanner. Discovers, classifies, and audits AI agents running in your AWS infrastructure and GitHub repositories.

            ### Installation

            Download the binary for your platform, make it executable, and move it to your PATH:

            ```bash
            # macOS (Apple Silicon)
            curl -Lo specter-scanner https://github.com/spectersystems/specter-scanner/releases/download/${{ github.ref_name }}/specter-scanner-darwin-arm64
            chmod +x specter-scanner && sudo mv specter-scanner /usr/local/bin/

            # macOS (Intel)
            curl -Lo specter-scanner https://github.com/spectersystems/specter-scanner/releases/download/${{ github.ref_name }}/specter-scanner-darwin-amd64
            chmod +x specter-scanner && sudo mv specter-scanner /usr/local/bin/

            # Linux (amd64)
            curl -Lo specter-scanner https://github.com/spectersystems/specter-scanner/releases/download/${{ github.ref_name }}/specter-scanner-linux-amd64
            chmod +x specter-scanner && sudo mv specter-scanner /usr/local/bin/
            ```

            See the [README](https://github.com/spectersystems/specter-scanner#readme) for full configuration options.

            ### Checksums

            Verify your download with the included checksums.txt file.
          files: |
            dist/specter-scanner-linux-amd64
            dist/specter-scanner-linux-arm64
            dist/specter-scanner-darwin-amd64
            dist/specter-scanner-darwin-arm64
            dist/specter-scanner-windows-amd64.exe
            dist/checksums.txt
          draft: false
          prerelease: false
